# PhysioCap Lab — GPU PC 한 대에서 실행:  docker compose up -d --build
# 필요: NVIDIA GPU(8GB 이상 권장) + NVIDIA 드라이버 + Docker + NVIDIA Container Toolkit (Windows 는 WSL2 + Docker Desktop)
name: physiocap-lab

x-gpu: &gpu
  deploy:
    resources:
      reservations:
        devices:
          - driver: nvidia
            count: 1
            capabilities: [gpu]

services:
  server:
    build: { context: ., dockerfile: server/Dockerfile }
    ports: ["8000:8000"]
    volumes: [physiocap-data:/data]
    restart: unless-stopped

  core:
    build: { context: ., dockerfile: worker_core/Dockerfile }
    volumes: [physiocap-data:/data]
    restart: unless-stopped
    <<: *gpu

  # OpenCap 기본 포즈 인식기(HRNet). opencap-core 저장소의 docker/mmpose 를 고정 커밋으로 빌드
  mmpose:
    build:
      context: https://github.com/stanfordnmbl/opencap-core.git#e5d29f12e725a2e14e6e4e85617834685f738753
      dockerfile: docker/mmpose/Dockerfile
    volumes: [physiocap-data:/mmpose/data]
    restart: on-failure:3
    <<: *gpu

  kinetics:
    build: { context: ., dockerfile: worker_kinetics/Dockerfile }
    volumes: [physiocap-data:/data]
    restart: unless-stopped

  # OpenPose 를 쓰려면: docker compose --profile openpose up -d  (세션의 포즈 인식기를 openpose 로)
  openpose:
    profiles: ["openpose"]
    build:
      context: https://github.com/stanfordnmbl/opencap-core.git#e5d29f12e725a2e14e6e4e85617834685f738753
      dockerfile: docker/openpose/Dockerfile
    volumes: [physiocap-data:/openpose/data]
    restart: on-failure:3
    <<: *gpu

volumes:
  physiocap-data:
